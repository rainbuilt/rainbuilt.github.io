<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>코펜하겐 · 수제 UX Mock</title><style>
:root{--b:#0f62fe;--i:#161616;--m:#525252;--l:#e0e0e0;--s:#f4f4f4;--r:#da1e28;--g:#198038}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:IBM Plex Sans,Apple SD Gothic Neo,Noto Sans KR,sans-serif;color:var(--i);background:#fff}button,input{font:inherit}button{border:0;border-radius:0;background:none;color:inherit;cursor:pointer}.app{max-width:430px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:#fff}.mock{height:32px;background:#161616;color:#fff;font-size:11px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.mock b{font-weight:500;color:#78a9ff}.head{height:56px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#fff;z-index:3}.brand{font-size:18px;font-weight:600}.brand::before{content:'c.';display:inline-grid;place-items:center;width:26px;height:26px;background:#161616;color:#fff;margin-right:8px;font-size:19px}.head button{padding:10px}.screen{flex:1;padding:24px 16px 92px}.ey{font-size:12px;color:var(--m);margin-bottom:8px}.title{font-size:28px;font-weight:400;line-height:1.25;margin:0 0 10px}.desc{font-size:14px;line-height:1.6;color:var(--m);margin:0 0 24px}.card{border:1px solid var(--l);padding:18px;margin-bottom:12px}.card.blue{background:#edf5ff;border-color:#a6c8ff}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.stack>*+*{margin-top:10px}.label{font-size:12px;color:var(--m)}.big{font-size:22px}.merchant{font-size:18px;font-weight:500}.amt{font-size:30px;font-weight:400;margin-top:8px}.btn{width:100%;min-height:48px;padding:14px 16px;background:var(--b);color:#fff;text-align:left;font-weight:500;margin-top:10px}.btn.secondary{background:#fff;color:var(--i);border:1px solid #8d8d8d}.btn.danger{background:#fff;color:var(--r);border:1px solid var(--r)}.btn:active{background:#002d9c}.link{color:var(--b);padding:10px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:72px;border-top:1px solid var(--l);background:#fff;display:grid;grid-template-columns:repeat(4,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{font-size:11px;color:var(--m)}.nav button.active{color:var(--b);background:#edf5ff}.pill{display:inline-block;font-size:11px;padding:4px 7px;background:#defbe6;color:#0e6027}.pill.pending{background:#fff8e1;color:#8e6a00}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input{width:100%;height:48px;border:0;border-bottom:1px solid #8d8d8d;background:var(--s);padding:0 14px;font-size:16px;outline:none}.field input:focus{outline:2px solid var(--b);outline-offset:-2px}.pin{display:flex;justify-content:center;gap:14px;margin:36px 0}.dot{width:12px;height:12px;border:1px solid #8d8d8d;border-radius:50%}.dot.on{background:#161616;border-color:#161616}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--l);margin:0 -16px -24px}.pad button{height:64px;background:#fff;font-size:20px}.notice{border-left:3px solid var(--b);background:#edf5ff;padding:14px 16px;font-size:13px;line-height:1.5;margin:16px 0}.empty{padding:64px 12px;text-align:center;color:var(--m)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);width:min(398px,calc(100% - 32px));background:#161616;color:#fff;padding:14px 16px;font-size:13px;z-index:10;display:none}.toast.show{display:block}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #8d8d8d;margin-bottom:20px}.seg button{height:40px}.seg button.on{background:#161616;color:#fff}.hist{padding:14px 0;border-bottom:1px solid var(--l)}.muted{color:var(--m);font-size:12px}.topspace{margin-top:28px}@media(min-width:700px){body{background:#f4f4f4}.app{box-shadow:0 0 0 1px #dcdcdc}.mock{position:sticky;top:0;z-index:7}.head{top:32px}}
</style></head><body><div class="app"><div class="mock"><span><b>●</b> UX Mock · 실제 결제 없음</span><button id="reset" style="color:#fff">초기화</button></div><header class="head"><div class="brand">코펜하겐</div><button id="alert">알림 1</button></header><main id="screen" class="screen"></main><nav class="nav"><button data-tab="wallet">지갑</button><button data-tab="address">배송지</button><button data-tab="history">기록</button><button data-tab="settings">설정</button></nav></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s),state={tab:'wallet',view:'home',pin:'258036',typed:'',card:true,address:true,pending:true,status:'pending'};
const money=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}
function shell(title,desc,body){return `<div class=ey>수제 · UX validation mock</div><h1 class=title>${title}</h1><p class=desc>${desc}</p>${body}`}
function wallet(){if(state.view==='approval')return approval();if(state.view==='pin')return pin();if(state.view==='result')return result();return shell('내 지갑','카드와 결제 요청을 한 곳에서 확인합니다.',`${state.pending&&state.status==='pending'?`<div class="card blue"><div class=row><span class="pill pending">승인 대기</span><span class=muted>3분 남음</span></div><div class=merchant style="margin-top:18px">맥도날드 강남점</div><div class=amt>${money(16500)}</div><div class=muted style="margin-top:8px">오늘 19:42 · 온라인 결제</div><button class=btn data-go=approval>요청 확인하기 →</button></div>`:''}<div class=row><h2 style="font-size:18px">등록 카드</h2><button class=link data-addcard>+ 카드 추가</button></div>${state.card?`<div class=card><div class=row><div><div class=label>기본 카드</div><div style="font-size:17px;margin-top:6px">VISA ···· 4242</div></div><span class=pill>사용 가능</span></div><div class=muted style="margin-top:16px">내 카드 · 12/29</div></div>`:`<div class=empty>등록된 카드가 없습니다.</div>`}`)}
function approval(){return shell('결제 요청 확인','승인 전 가맹점과 금액을 다시 확인해 주세요.',`<div class=card><div class=label>가맹점</div><div class=merchant>맥도날드 강남점</div><div class=amt>${money(16500)}</div><div class=topspace><div class=row><span class=muted>카드</span><span>VISA ···· 4242</span></div><div class=row style="margin-top:12px"><span class=muted>요청 시각</span><span>오늘 19:42</span></div></div></div><div class=notice>이 Mock은 실제 결제를 실행하지 않습니다. 승인 UX만 체험합니다.</div><button class=btn data-approve>승인하고 PIN 입력 →</button><button class="btn danger" data-decline>결제 거절</button><button class="btn secondary" data-back>나중에 확인</button>`)}
function pin(){return shell('결제 PIN 입력','6자리 PIN을 입력해 본인 확인을 완료합니다.',`<div class=pin>${[0,1,2,3,4,5].map(i=>`<i class="dot ${i<state.typed.length?'on':''}"></i>`).join('')}</div><div class=muted style="text-align:center;margin-bottom:28px">테스트 PIN: 258036</div><div class=pad>${[1,2,3,4,5,6,7,8,9,'←',0,'✓'].map(x=>`<button data-key="${x}">${x}</button>`).join('')}</div>`)}
function result(){let ok=state.status==='approved';return shell(ok?'결제가 승인됐어요':'결제를 거절했어요',ok?'승인 결과가 기록되었습니다.':'가맹점에 거절 결과가 전달되는 상황을 가정합니다.',`<div class="card ${ok?'blue':''}"><span class="pill ${ok?'':'pending'}">${ok?'승인 완료':'거절 완료'}</span><div class=merchant style="margin-top:18px">맥도날드 강남점</div><div class=amt>${money(16500)}</div></div><button class=btn data-home>지갑으로 돌아가기</button>`)}
function address(){return shell('배송지 관리','기본 배송지를 확인하고 수정하는 흐름입니다.',state.address?`<div class=card><div class=row><div><div class=label>기본 배송지</div><div style="font-size:17px;margin-top:6px">홍길동</div></div><span class=pill>기본</span></div><p style="line-height:1.6;margin:16px 0 0">서울특별시 강남구 테헤란로 123<br>코펜하겐빌딩 7층</p><div class=muted style="margin-top:8px">010-1234-5678 · 문 앞에 놓아주세요</div><button class="btn secondary" data-editaddr>배송지 수정</button></div><button class=btn data-newaddr>새 배송지 추가</button>`:`<div class=empty>등록된 배송지가 없습니다.<button class=btn data-newaddr>배송지 추가</button></div>`)}
function history(){return shell('결제 기록','승인·거절 상태를 빠르게 확인합니다.',`<div class=seg><button class=on>전체</button><button>승인만</button></div><div class=hist><div class=row><b>맥도날드 강남점</b><span>${money(16500)}</span></div><div class=muted style="margin-top:6px">오늘 · ${state.status==='declined'?'거절':'승인'}</div></div><div class=hist><div class=row><b>코펜하겐 테스트 상점</b><span>32,000원</span></div><div class=muted style="margin-top:6px">어제 · 승인</div></div>`)}
function settings(){return shell('설정','Mock 상태를 바꾸며 UX를 반복 검증합니다.',`<div class=card><div class=row><span>결제 알림</span><span class=pill>켜짐</span></div></div><button class="btn secondary" data-sim>새 결제 요청 만들기</button><button class="btn secondary" data-cardtoggle>${state.card?'카드 제거 상태 보기':'샘플 카드 복원'}</button><button class="btn secondary" data-addrtoggle>${state.address?'배송지 제거 상태 보기':'샘플 배송지 복원'}</button><div class=notice>상태는 이 페이지 안에서만 바뀌며 실제 계정·카드·주소와 연결되지 않습니다.</div>`)}
function render(){nav();let html=state.tab==='wallet'?wallet():state.tab==='address'?address():state.tab==='history'?history():settings();$('#screen').innerHTML=html;window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.view='home';render();return}if(b.dataset.go){state.view=b.dataset.go;render()}if(b.hasAttribute('data-approve')){state.view='pin';state.typed='';render()}if(b.hasAttribute('data-decline')){state.status='declined';state.pending=false;state.view='result';render()}if(b.dataset.key){let k=b.dataset.key;if(k==='←')state.typed=state.typed.slice(0,-1);else if(k==='✓'){if(state.typed===state.pin){state.status='approved';state.pending=false;state.view='result';toast('PIN 확인 완료')}else{state.typed='';toast('PIN이 일치하지 않습니다')}}else if(state.typed.length<6)state.typed+=k;render()}if(b.hasAttribute('data-back')||b.hasAttribute('data-home')){state.view='home';render()}if(b.hasAttribute('data-sim')){state.pending=true;state.status='pending';state.tab='wallet';state.view='home';toast('새 결제 요청을 만들었어요');render()}if(b.hasAttribute('data-cardtoggle')){state.card=!state.card;render()}if(b.hasAttribute('data-addrtoggle')){state.address=!state.address;render()}if(b.hasAttribute('data-addcard'))toast('카드 등록 화면은 다음 iteration에서 검증');if(b.hasAttribute('data-editaddr')||b.hasAttribute('data-newaddr'))toast('주소 입력 폼 interaction point');});
$('#alert').onclick=()=>{state.tab='wallet';state.view=state.pending?'approval':'home';render()};$('#reset').onclick=()=>{Object.assign(state,{tab:'wallet',view:'home',typed:'',card:true,address:true,pending:true,status:'pending'});render();toast('Mock 상태를 초기화했어요')};render();
</script></body></html>
